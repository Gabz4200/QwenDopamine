# Base model configuration for the reference Qwen3.5 gated-delta stack.
model_type: qwen_like
block_types:
  - gdn
  - gdn
  - gdn
  - gdn
num_layers: 4
hidden_size: 2560
num_attention_heads: 32
num_key_value_heads: 8
linear_key_head_dim: 128
linear_value_head_dim: 128
linear_num_key_heads: 16
linear_num_value_heads: 32
intermediate_size: 6912
hidden_act: silu
hidden_dropout_prob: 0.05
attention_dropout_prob: 0.05
reward_dropout_prob: 0.10
advantage_dropout_prob: 0.05
gate_loss_weight: 0.01
gate_target_balance: 0.5
rms_norm_eps: 1.0e-6

# Parallel GatedRewardNet branch.
# Disabled by default; opt-in to attach a reward-modulated parallel mixer to
# every attention-only layer or to an explicit allow-list of layer indices.
# The data-dependent gate is initialised so sigmoid(bias) ≈ 0.0067 so a
# pretrained backbone is left effectively untouched at the start of training.
use_parallel_reward: false
parallel_reward_layers: []
reward_gate_init_bias: -5.0
reward_memory_rank: null
# null = dense d×d fast-weight state. 8/16/32/64 = low-rank factorisation.
