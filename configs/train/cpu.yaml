defaults:
  - /data: pretrain
  - /model: base
  - _self_

train:
  max_steps: 100000
  log_interval: 100
  save_interval: 5000
  eval_interval: 2000
  grad_accum_steps: 4
  max_grad_norm: 1.0
  mixed_precision: null
  device: cpu

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 2000
  min_lr: 1.0e-5

checkpoint:
  dir: logs/train/runs/${now:%Y-%m-%d_%H%M%S}
  save_top_k: 5
  resume_from_checkpoint: null

quantization:
  enabled: true
  method: int8
  compute_dtype: bfloat16

# Parallel GatedRewardNet monitoring. When the parallel branch is attached
# the trainer logs reward gate norms, branch output norms, omega, baseline,
# and cache utilisation on a fixed cadence to make the new state observable.
parallel_reward:
  enabled: ${model.use_parallel_reward}
  log_interval: ${train.log_interval}
  warn_branch_ratio_above: 0.10
