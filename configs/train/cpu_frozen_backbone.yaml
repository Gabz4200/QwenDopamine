defaults:
  - /train: cpu
  - _self_

# NOTE: These unfreeze layers assume a 12+ layer base model (e.g. qwen35_custom_block.yaml).
# The default /model: base has only 4 layers. Compose with a larger model config.

freeze:
  base_model: true
  new_blocks: false
  unfreeze_phases:
    - step: 5000
      modules: [model.layers.12]
    - step: 10000
      modules: [model.layers.24]
