defaults:
  - /data: pretrain
  - /model: base
  - _self_

train:
  max_steps: 100000
  log_interval: 100
  save_interval: 5000
  eval_interval: 2000
  grad_accum_steps: 1
  max_grad_norm: 1.0
  mixed_precision: bf16

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 2000
  min_lr: 1.0e-5

checkpoint:
  dir: logs/train/runs/${now:%Y-%m-%d_%H%M%S}
  save_top_k: 5
  resume_from_checkpoint: null

parallel_reward:
  enabled: ${model.use_parallel_reward}
  log_interval: ${train.log_interval}
  warn_branch_ratio_above: 0.10
