[project]
name = "qwendopamine"
version = "0.2.0"
description = "Research framework for Qwen-style LLM architectures with novel PyTorch recurrent blocks, HF/GGUF interoperability, and pure PyTorch training."
readme = "README.md"
authors = [
    { name = "Joao Gabriel Souza Amaral", email = "jgsa75005@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.7.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "omegaconf>=2.3.0",
    "safetensors>=0.4.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.40.0",
]
include-package-data = true


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchao = { index = "pytorch" }

[project.optional-dependencies]
cpu = [
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "gguf>=0.6.0",
    "sentencepiece>=0.1.99",
    "torchao>=0.1.0",
    "torchvision>=0.15.0",
]
gpu = [
    "accelerate>=0.25.0",
    "flash-linear-attention>=0.5.0",
    "trl>=0.8.0",
    "unsloth>=2024.1",
]
hf = [
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",
    "tokenizers>=0.15.0",
]
dev = [
    "ipykernel>=6.20.0",
    "pyrefly>=0.15.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
qwendopamine = "qwendopamine:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = ["notebooks/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
