[project]
name = "qwendopamine"
version = "0.1.0"
description = "Research scaffold for Qwen-style architectures with custom blocks, HF integration, and pure PyTorch training."
readme = "README.md"
authors = [
    { name = "Joao Gabriel Souza Amaral", email = "jgsa75005@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "safetensors>=0.5.1",
    "torch>=2.13.0",
    "torchao>=0.18.0",
    "torchvision>=0.28.0",
    "transformers>=4.55.0",
    "datasets>=4.2.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "tqdm>=4.67.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.44.0",
    "gguf>=0.10.0",
    "sentencepiece>=0.2.0",
]

[dependency-groups]
hf = ["huggingface-hub>=0.34.0", "tokenizers>=0.21.0"]
dev = ["pytest>=8.3.0", "ruff>=0.9.0", "ipykernel>=6.30.0"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchao = { index = "pytorch" }

[project.scripts]
qwendopamine = "qwendopamine:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
