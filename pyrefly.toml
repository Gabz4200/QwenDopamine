project-includes = ["src/**/*.py", "tests/**/*.py"]

[errors]
implicit-import = false
implicit-any = true
unannotated-return = true
unannotated-parameter = true

[[sub-config]]
matches = "src/qwendopamine/models/qwen35/**"
[sub-config.errors]
implicit-import = false
implicit-any = false
unannotated-return = false
unannotated-parameter = false
bad-override = false
bad-override-mutable-attribute = false
bad-argument-type = false
bad-assignment = false
missing-attribute = false
unsupported-operation = false
bad-function-definition = false
bad-return = false
implicit-any-type-argument = false
implicit-any-lambda = false
implicit-any-empty-container = false
bad-argument-count = false

[[sub-config]]
matches = "tests/**"
[sub-config.errors]
implicit-import = false
implicit-any = true
unannotated-return = false
unannotated-parameter = false

[[sub-config]]
matches = "notebooks/**"
[sub-config.errors]
implicit-import = false
implicit-any = false
unannotated-return = false
unannotated-parameter = false
